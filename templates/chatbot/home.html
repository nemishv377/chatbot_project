{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #dbeafe 0%, #f0f9ff 50%, #e0e7ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 4rem 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 600px;   /* ⬅ bigger width */
      transform: translateY(0);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin-bottom: 2.5rem;
      font-size: 2.4rem; /* bigger heading */
      font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    a.button {
      display: block;
      margin: 1.2rem 0;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #93c5fd, #c4b5fd);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 6px 14px rgba(147, 197, 253, 0.25);
    }

    a.button:hover {
      background: linear-gradient(135deg, #c4b5fd, #93c5fd);
      transform: translateY(-4px);
      box-shadow: 0 10px 18px rgba(147, 197, 253, 0.35);
    }

    a.button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌿 Choose Your Chatbot</h1>
    <a href="{% url 'general-chat-page' %}" class="button">💬 General Chatbot</a>
    <a href="{% url 'assistant-chat-page' %}" class="button">📚 Docs-based Chatbot</a>
  </div>
</body>
</html>
